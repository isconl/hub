# Local / self-hosted deployment of the whole isconl-agent fleet: one
# Docker network, one compose file, six engines. This is the "most portable
# means" the owner asked for -- runs identically on a laptop, a bare-metal
# box, or an Oracle Compute instance (the server-space rebuild's target).
#
# ASSUMES the standard local checkout layout: all 6 repos as sibling
# directories under engineer-systems/Systems/iSconl/ (matches how this
# session cloned them). Production deployment is per-service (Render today,
# Oracle later) rather than this compose file -- this is for running the
# whole stack together: local dev, self-hosted, or a single-box fallback.
#
# Secrets: every engine pulls its own from Bitwarden at boot via
# BWS_ACCESS_TOKEN/BWS_ORGANIZATION_ID (see lib/secrets.js in each repo) --
# nothing sensitive belongs in this file or a baked-in image, matching the
# owner's "Render holds no data/secrets" design intent applied here too.
#
# Usage: cp .env.example .env, fill in tokens, then `docker compose up -d`.
#
# Per-service cpus/memory limits below deliberately sum below a single
# Oracle Always-Free Ampere A1 instance's 4 OCPU/24GB, leaving headroom for
# other services sharing the same box rather than claiming the whole thing.

services:
  vault:
    build: ../vault
    container_name: isconl-vault
    restart: unless-stopped
    environment:
      VAULT_BIND: 0.0.0.0
      VAULT_TOKEN: ${VAULT_TOKEN}
      BWS_ACCESS_TOKEN: ${BWS_ACCESS_TOKEN}
      BWS_ORGANIZATION_ID: ${BWS_ORGANIZATION_ID}
      BWS_API_URL: ${BWS_API_URL}
      BWS_IDENTITY_URL: ${BWS_IDENTITY_URL}
    volumes:
      - vault-memory:/app/memory
      - vault-runtime:/app/runtime
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1536m }

  pulse:
    build: ../pulse
    container_name: isconl-pulse
    restart: unless-stopped
    depends_on: [vault]
    environment:
      PULSE_BIND: 0.0.0.0
      PULSE_TOKEN: ${PULSE_TOKEN}
      VAULT_URL: http://vault:8081
      VAULT_TOKEN: ${VAULT_TOKEN}
      BWS_ACCESS_TOKEN: ${BWS_ACCESS_TOKEN}
      BWS_ORGANIZATION_ID: ${BWS_ORGANIZATION_ID}
      BWS_API_URL: ${BWS_API_URL}
      BWS_IDENTITY_URL: ${BWS_IDENTITY_URL}
    volumes:
      - pulse-runtime:/app/runtime
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits: { cpus: "0.4", memory: 768m }

  scope:
    build: ../scope
    container_name: isconl-scope
    restart: unless-stopped
    depends_on: [vault]
    environment:
      SCOPE_BIND: 0.0.0.0
      SCOPE_TOKEN: ${SCOPE_TOKEN}
      VAULT_URL: http://vault:8081
      VAULT_TOKEN: ${VAULT_TOKEN}
      JIRA_HOST: ${JIRA_HOST}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_PROJECT: ${JIRA_PROJECT}
      BWS_ACCESS_TOKEN: ${BWS_ACCESS_TOKEN}
      BWS_ORGANIZATION_ID: ${BWS_ORGANIZATION_ID}
      BWS_API_URL: ${BWS_API_URL}
      BWS_IDENTITY_URL: ${BWS_IDENTITY_URL}
    volumes:
      - scope-runtime:/app/runtime
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits: { cpus: "0.4", memory: 768m }

  circle:
    build: ../circle
    container_name: isconl-circle
    restart: unless-stopped
    depends_on: [vault]
    environment:
      CIRCLE_BIND: 0.0.0.0
      CIRCLE_TOKEN: ${CIRCLE_TOKEN}
      VAULT_URL: http://vault:8081
      VAULT_TOKEN: ${VAULT_TOKEN}
      BWS_ACCESS_TOKEN: ${BWS_ACCESS_TOKEN}
      BWS_ORGANIZATION_ID: ${BWS_ORGANIZATION_ID}
      BWS_API_URL: ${BWS_API_URL}
      BWS_IDENTITY_URL: ${BWS_IDENTITY_URL}
    volumes:
      - circle-runtime:/app/runtime
    ports:
      - "8084:8084"
    deploy:
      resources:
        limits: { cpus: "0.4", memory: 768m }

  spark:
    build: ../spark
    container_name: isconl-spark
    restart: unless-stopped
    depends_on: [vault, scope]
    environment:
      SPARK_BIND: 0.0.0.0
      SPARK_TOKEN: ${SPARK_TOKEN}
      VAULT_URL: http://vault:8081
      VAULT_TOKEN: ${VAULT_TOKEN}
      BWS_ACCESS_TOKEN: ${BWS_ACCESS_TOKEN}
      BWS_ORGANIZATION_ID: ${BWS_ORGANIZATION_ID}
      BWS_API_URL: ${BWS_API_URL}
      BWS_IDENTITY_URL: ${BWS_IDENTITY_URL}
    volumes:
      - spark-runtime:/app/runtime
    ports:
      - "8085:8085"
    deploy:
      resources:
        limits: { cpus: "0.4", memory: 768m }

  hub:
    build: .
    container_name: isconl-hub
    restart: unless-stopped
    depends_on: [vault, pulse, scope, circle, spark]
    environment:
      HUB_BIND: 0.0.0.0
      HUB_TOKEN: ${HUB_TOKEN}
      VAULT_URL: http://vault:8081
      VAULT_TOKEN: ${VAULT_TOKEN}
      PULSE_URL: http://pulse:8082
      PULSE_TOKEN: ${PULSE_TOKEN}
      SCOPE_URL: http://scope:8083
      SCOPE_TOKEN: ${SCOPE_TOKEN}
      CIRCLE_URL: http://circle:8084
      CIRCLE_TOKEN: ${CIRCLE_TOKEN}
      SPARK_URL: http://spark:8085
      SPARK_TOKEN: ${SPARK_TOKEN}
      RENDER_API_KEY: ${RENDER_API_KEY}
      LEGACY_API_URL: ${LEGACY_API_URL}
      LEGACY_TOKEN: ${LEGACY_TOKEN}
      BWS_ACCESS_TOKEN: ${BWS_ACCESS_TOKEN}
      BWS_ORGANIZATION_ID: ${BWS_ORGANIZATION_ID}
      BWS_API_URL: ${BWS_API_URL}
      BWS_IDENTITY_URL: ${BWS_IDENTITY_URL}
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1536m }

volumes:
  vault-memory:
  vault-runtime:
  pulse-runtime:
  scope-runtime:
  circle-runtime:
  spark-runtime:
