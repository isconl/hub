# Builds, signs, versions and releases the iSconl APK.
#
# Triggers:
#  - push to the apk branch (code changes; bump commits carry [skip ci])
#  - workflow_dispatch (ARCHITECT's manual cue)
#  - repository_dispatch type "apk-build" / workflow call from main's
#    trigger workflow (staged at docs/main-trigger/) - fires when main is
#    pushed, once that trigger is installed on main.
#
# Every run: bump patch version -> regenerate icons (adopts branding/icon.png
# if present) -> build signed release APK -> commit the bump back ->
# publish GitHub Release apk-vX.Y.Z with YYYYMMDD_isconl_vX.Y.Z.apk attached.
# The app's "Check for update" reads these releases.

name: Build APK

on:
  push:
    branches: [apk]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  repository_dispatch:
    types: [apk-build]

concurrency:
  group: apk-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apk branch
        uses: actions/checkout@v4
        with:
          ref: apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Bump version
        id: bump
        run: |
          VERSION=$(node tool/bump_version.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Regenerate launcher icons
        run: node tool/icon_gen.js

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret missing - releases must be signed"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Name artifact
        id: name
        run: |
          NAME="${{ steps.bump.outputs.date }}_isconl_v${{ steps.bump.outputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "isconl-ci"
          git config user.email "ci@isconl.local"
          git add pubspec.yaml
          git commit -m "ci: bump to v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v${{ steps.bump.outputs.version }}" \
            "${{ steps.name.outputs.apk }}" \
            --target apk \
            --title "iSconl APK v${{ steps.bump.outputs.version }}" \
            --notes "Automated build from the apk branch. Install over the previous version - data is preserved. In-app: Settings -> Check for update."
